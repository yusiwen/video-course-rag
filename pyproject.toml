[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-course-rag"
version = "0.1.0a1"
description = "Turn recorded lectures into a searchable, self-contained course package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yusiwen" }]
keywords = ["lecture", "video", "transcript", "retrieval", "offline"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
]
dependencies = []

[project.optional-dependencies]
# Speech-to-text. torch/torchaudio install from the CUDA index on a GPU box:
#   uv pip install --extra-index-url https://download.pytorch.org/whl/cu130 \
#       "torch==2.11.0+cu130" "torchaudio==2.11.0+cu130"
asr = ["funasr>=1.1", "torch", "torchaudio", "numpy"]
# Screen-reading on anything that is not macOS (the Vision helper needs Swift).
# onnxruntime is the default engine and needs no GPU. Setting
# VIDEO_RAG_OCR_ENGINE=torch VIDEO_RAG_OCR_DEVICE=cuda runs the same PP-OCR
# models through torch instead — no extra package, since the `asr` extra already
# brings torch; the weights (~32 MB) download once to ~/.cache on first use.
ocr-linux = ["rapidocr>=3", "onnxruntime>=1.17", "opencv-python-headless", "pillow"]
dev = ["pytest"]

[project.scripts]
vrag = "video_rag.cli:main"

[project.urls]
Homepage = "https://github.com/yusiwen/video-course-rag"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_rag = ["pack/assets/*"]
